<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Realty Object Added For you As Realtor</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; line-height: 1.6;">
<h1 style="text-align: center;">User Just Added a New Realty Object And Assigned To You</h1>
<div style="margin: 20px 0;">
    <h2>User Details</h2>
    <p><strong>Name:</strong> <span th:text="${user.name}"></span></p>
    <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
    <p th:if="${user.phoneNumber != null}"><strong>Phone:</strong> <span th:text="${user.phoneNumber}"></span></p>
    <div th:replace="shared/sharedRealtyObjectBlock :: realtyObject(${realtyObject})"></div>
</div>
</body>
</html>
