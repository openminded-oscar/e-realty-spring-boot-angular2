<div class="row">
  <div class="col-12">
    <form [formGroup]="realtyForm">
      <h5 class="text-center">Please Fill Information On The Object:</h5>
      <aw-wizard [navBarLayout]="'large-empty'">
        <aw-wizard-step stepTitle="Select Your Place on Map">
            <div style="display: flex; justify-content: center; align-items: flex-start; position: relative;">
                <div style="text-align: center;">
                    <h6 class="text-right">Select Your Region:</h6>
                    <div [formGroup]="basicInfoFormGroup">
                        <ng-container [formGroupName]="'address'">
                        <select  [formControlName]="'region'"
                                class="form-control"
                                name="selected-region"
                                style="text-align: center">
                            <option value="" disabled>Select Region</option> <!-- Placeholder option -->
                            <option *ngFor="let region of supportedRegions" [value]="region.id">
                                {{ region.name }}
                            </option>
                        </select>
                        </ng-container>
                    </div>
                </div>

                <div class="text-right mb-2 action-buttons" style="position: absolute; right: 10px;">
                    <button type="button"
                            class="btn btn-info"
                            (click)="confirmLocationAndNavigate()">Next Step
                    </button>
                    <button type="button"
                            class="btn btn-dark"
                            [disabled]="realtyForm.invalid"
                            (click)="saveRealtyObject()">Save
                    </button>
                </div>
            </div>

          <div style="display: flex; flex-direction: row; align-items: center; justify-content: center">
            <div class="geomap-container">
              <app-select-location [initialLocation]="initialLocation"
                                   [editModeInitialized]="editModeInitialized"
                                   (locationSelected)="changeLocation($event)"></app-select-location>
            </div>
          </div>
        </aw-wizard-step>
        <aw-wizard-step (stepEnter)="autofillAddressFromMapIfChanged()" [formGroup]="basicInfoFormGroup" stepTitle="Address and primary info">
          <div class="text-right mb-2 action-buttons">
            <button type="button" class="btn btn-info" awPreviousStep>Prev Step</button>
            <button type="button" class="btn btn-info" awNextStep>Next Step</button>
            <button type="button" class="btn btn-dark" [disabled]="realtyForm.invalid" (click)="saveRealtyObject()">Save
            </button>
          </div>
          <div class="form-horizontal">
            <div class="form-group row" [formGroupName]="'address'">
              <label class="col-md-1 col-form-label text-right">City:</label>
              <div class="col-md-3">
                <input class="form-control" style="width: 100%" [formControlName]="'city'">
              </div>
              <label class="col-md-1 col-form-label text-right">Street:</label>
              <div class="col-md-3">
                <input class="form-control" style="width: 100%" [formControlName]="'street'">
              </div>
              <label class="col-md-1 col-form-label text-right" for="number-of-street-input">Building number:</label>
              <div class="col-md-3">
                <input id="number-of-street-input" name="buildingNumber" type="text"
                       class="form-control"
                       [formControlName]="'numberOfStreet'">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-md-1 col-form-label text-right">Dwelling type:</label>
              <div class="col-md-3">
                <select [formControlName]="'dwellingType'" name="dwellingType" class="select-input form-control">
                  <option *ngFor="let dwellingType of dwellingTypes" [value]="dwellingType">{{ dwellingType }}
                  </option>
                </select>
              </div>
              <ng-container [formGroupName]="'address'">
                <label class="col-md-1 col-form-label text-right" for="apt-number-input">Apt.
                  number:</label>
                <div class="col-md-3">
                  <input id="apt-number-input" [formControlName]="'apartmentNumber'"
                         name="flatNum"
                         type="text"
                         class="form-control">
                </div>
              </ng-container>
              <label class="col-md-1 col-form-label text-right" for="rooms-amount-input">Rooms amount:</label>
              <div class="col-md-3">
                <input id="rooms-amount-input" name="rooms" type="number" class="form-control"
                       [formControlName]="'roomsAmount'">
              </div>
            </div>

            <div class="form-group row">
              <label class="col-form-label col-md-1 text-right">Building type:</label>
              <div class="col-md-3">
                <select [formControlName]="'buildingType'" name="buildingType" class="form-control">
                  <option *ngFor="let buildingType of buildingTypes" [ngValue]="buildingType">{{ buildingType }}
                  </option>
                </select>
              </div>

              <label class="col-form-label col-md-1 text-right">Living Area:</label>
              <div class="col-md-3" style="display: flex; justify-content: space-between">
                <div>
                  <input id="living-area-input" name="livingArea" type="number" class="form-control"
                         placeholder="65"
                         [formControlName]="'livingArea'">
                </div>
                <div>
                  <label class="col-form-label col-md-1 text-center"
                         style="margin-left: 1rem; margin-right: 1rem;">of</label>
                </div>
                <div>
                  <input id="total-area-input" name="total-area" type="number" class="form-control"
                         placeholder="80"
                         [formControlName]="'totalArea'">
                </div>
              </div>

              <label class="col-form-label col-md-1 text-right">Floor:</label>
              <div class="col-md-3" style="display: flex; justify-content: space-between">
                <div>
                  <input id="floor-input" name="floor" type="number" class="form-control"
                         placeholder="3"
                         [formControlName]="'floor'">
                </div>

                <div>
                  <label class="col-form-label col-md-1 text-center"
                         style="margin-left: 1rem; margin-right: 1rem;">of</label>
                </div>
                <div>
                  <input id="building-floors-input" name="buildNum" type="number" class="form-control"
                         placeholder="9"
                         [formControlName]="'totalFloors'">
                </div>
              </div>
            </div>
          </div>
        </aw-wizard-step>


        <aw-wizard-step stepTitle="Description and targeting">
          <div class="row mb-2">
            <div class="text-right action-buttons">
              <button type="button" class="btn btn-info" awPreviousStep>Prev Step</button>
              <button type="button" class="btn btn-info" awNextStep>Next Step</button>
              <button type="button" class="btn btn-dark" [disabled]="realtyForm.invalid" (click)="saveRealtyObject()">
                Save
              </button>
            </div>
          </div>
          <div [formGroup]="importantInfoFormGroup" class="form-horizontal">
            <div class="form-group row" style="margin-bottom: 20px">
              <div class="col-md-1 col-form-label">
                <label for="description-input">Overall description:</label>
              </div>
              <div class="col-md-5">
        					<textarea rows="3" maxlength="255" [formControlName]="'description'" class="form-control"
                            id="description-input" name="description-input"></textarea>
              </div>
              <div class="col-md-1 col-form-label">
                <label for="other-info-input">Other info:</label>
              </div>
              <div class="col-md-5">
        					<textarea rows="3" maxlength="64" name="otherInfo" [formControlName]="'otherInfo'"
                            class="form-control"
                            id="other-info-input"
                  ></textarea>
              </div>
            </div>
            <div class="form-group row">
              <div class="col-md-1">
                <label for="foundation-year-input">Foundation year:</label>
              </div>
              <div class="col-md-2">
                <input class="form-control" id="foundation-year-input"
                       [formControlName]="'foundationYear'" name="foundationYear">
              </div>
              <div class="col-md-3" style="display: flex; align-items: center">
                <label>Recently repaired</label>
                <input name="repairing"
                       type="checkbox"
                       [formControlName]="'hasRepairing'"
                       class="big-checkbox">
              </div>
              <div class="col-md-2" style="display: flex; align-items: center">
                <label>
                  Garage
                </label>
                <input type="checkbox"
                       name="garage"
                       [formControlName]="'hasGarage'"
                       class="big-checkbox">
              </div>
              <div class="col-md-2" style="display: flex; align-items: center">
                <label>
                  Cellar
                </label>
                <input type="checkbox"
                       name="cellar"
                       [formControlName]="'hasCellar'"
                       class="big-checkbox">
              </div>
              <div class="col-md-2" style="display: flex; align-items: center">
                <label>
                  Loft
                </label>
                <input type="checkbox"
                       name="loft"
                       [formControlName]="'hasLoft'"
                       class="big-checkbox">
              </div>
            </div>
            <hr/>
            <div class="row">
              <ng-container [formArrayName]="'targetOperations'"
                            *ngFor="let operation of operationsInputValues; let i = index">
                <div class="col-md-1 me-0 ms-0">
                </div>
                <div [formGroupName]="i" class="col-md-5">
                  <label>
                    <input class="big-checkbox"
                           type="checkbox"
                           [formControlName]="'checked'"
                           [name]="operation.name"
                           [value]="operation.checked"/>
                    {{ operation.name }}&nbsp;enabled
                  </label>
                </div>
              </ng-container>
            </div>
            <div class="row">
              <div class="col-md-1">
                <label class="col-form-label" for="price-input">Selling price:</label>
              </div>
              <div class="col-md-5">
                <input id="price-input" name="price" type="text"
                       class="form-control"
                       [formControlName]="'price'">
              </div>
              <div class="col-md-1">
                <label class="col-form-label" for="price-input">Rent price ($ per month):</label>
              </div>
              <div class="col-md-5">
                <input id="price-rent-input" name="price-for-rent" type="text"
                       class="form-control"
                       [formControlName]="'priceForRent'">
              </div>
            </div>
            <hr/>
            <div class="row">
              <div class="col-md-2 col-form-label">
                <label>Realtor:</label>
              </div>
              <div class="col-md-10">
                <select class="form-control"
                        [formControlName]="'realtor'"
                        name="selected-realtor">
                  <option value="" disabled>Select Realtor For Your Object</option> <!-- Placeholder option -->
                  <option *ngFor="let realtor of realtors" [value]="realtor.id">
                    {{ realtor.name + ' ' + realtor.surname }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </aw-wizard-step>
        <aw-wizard-step [formGroupName]="'photosFormGroup'" stepTitle="Photos and ownership confirmation">
          <div class="row mb-2">
            <div class="text-right action-buttons">
              <button type="button" class="btn btn-info" awPreviousStep>Prev Step</button>
              <button type="button" class="btn btn-info" disabled>Next Step</button>
              <button type="button" class="btn btn-dark" [disabled]="realtyForm.invalid" (click)="saveRealtyObject()">
                Save
              </button>
            </div>
          </div>
          <div class="form-horizontal">
            <div class="form-group row">
              <div class="col-md-3">
                <label class="col-form-label">Ownership verification photo (required):&nbsp;</label>
                <input type="file" (change)="onVerificationPictureSelecting($event)" placeholder="Upload file"
                       accept="image/*">
                <div class="realty-confirmation-pic-preview-container">
                  <img class="img-fluid" [src]="photosFormGroup.get('confirmationDocPhoto')?.value?.fullUrl || ''">
                </div>
              </div>
              <div class="col-md-9">
                <div style="margin-bottom: 5px">
                  <label class="col-form-label">Realty object photos (max. 5 MB):&nbsp;</label>
                  <br/>
                  <input type="file" (change)="onRealtyObjPictureSelecting($event)" placeholder="Upload file"
                         accept="image/*" required>
                </div>
                <div class="row">
                  <div class="col-md-3 realty-pic-preview-container"
                       *ngFor="let photo of photosFormGroup.get('photos')?.value; let i = index">
                    <img class="img-fluid" [src]="photo.fullUrl || ''">
                    <div *ngIf="photo.type!==photoType.REALTY_MAIN">
                      <button (click)="makeMain(i)" class="btn btn-warning">Set as main</button>
                    </div>
                    <div *ngIf="photo.type===photoType.REALTY_MAIN">
                      <div class="main-photo-text">Main photo</div>
                    </div>
                    <button class="btn btn-danger" (click)="deletePhoto(i)">x</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </aw-wizard-step>
      </aw-wizard>
    </form>
  </div>
</div>
