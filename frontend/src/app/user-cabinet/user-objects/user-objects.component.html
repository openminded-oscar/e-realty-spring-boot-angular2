<app-objects-in-profile-filter (filterChanged)="setFilter($event)" [filter]="filter">
</app-objects-in-profile-filter>
<realty-objs-list *ngIf="filteredObjects?.length; else addObjectsTemplate"
                  [displayMode]="'reset'"
                  [showCreatedAt]="true"
                  [showManageStatusOptions]="true"
                  [realtyObjectsPortion]="filteredObjects"></realty-objs-list>
<ng-template #addObjectsTemplate>
  <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 30vh">
    <div>For Now You Didn't Add Any Objects. Enjoy Using Our Service!</div>
  </div>
</ng-template>
