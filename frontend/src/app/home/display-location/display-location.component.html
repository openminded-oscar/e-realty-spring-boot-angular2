<div>
  <h5>Location Area</h5>
</div>
<div>
  <div class="map-widget-container">
    <div *ngIf="center; else noLocation"
         leaflet
         [leafletOptions]="options"
         [leafletLayers]="layers"
    >
    </div>
    <ng-template #noLocation>
      <div style="font-size: 1rem">No Location Mentioned</div>
    </ng-template>
  </div>
</div>
