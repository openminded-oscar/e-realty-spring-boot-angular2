<div>
  <h5>Location Area</h5>
</div>
<div>
  <div class="map-widget-container">
    <div style="height: 100%; width: 100%; cursor: pointer" *ngIf="center; else noLocation"
         (leafletClick)="openOnGoogleMaps(center)"
         leaflet
         [leafletOptions]="options"
         [leafletLayers]="layers"
    >
    </div>
    <ng-template #noLocation>
      <div class="no-location-inscription">No Location Mentioned</div>
    </ng-template>
  </div>
</div>
