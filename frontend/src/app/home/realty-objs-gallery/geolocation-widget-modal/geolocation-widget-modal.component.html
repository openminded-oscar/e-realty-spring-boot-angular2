<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Please View The Available Objects:</h4>
  <div>
    <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span>&times;</span>
    </button>
  </div>
</div>

<div class="modal-body">
  <app-geolocation-widget [zoomLevel]="zoomLevel" [initialLocation]="initialLocation"></app-geolocation-widget>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="modal.dismiss(false)">Back</button>
</div>
