<app-realty-obj-card-details [realtyObject]="realtyObject"
                             [isMyObject]="isMyObject"
                             [showCreatedAt]="showCreatedAt">
    <ng-container topRow>
        <h4 style="flex: 1; text-overflow: ellipsis; overflow: auto">
        <span [routerLink]="['/realty-object', realtyObject.id]"
              style="cursor: pointer">{{ realtyObject.address.street }},&nbsp;{{ realtyObject.address.city }}</span>
        </h4>
        <ng-container *ngIf="showManageStatusOptions">
            <app-realty-status-editor [realtyObject]="realtyObject"></app-realty-status-editor>
        </ng-container>
        <div>
            <div *ngIf="isMyObject">
                <a [routerLink]="['/realty-object', realtyObject.id, 'editor']" style="padding: 0 5px;"
                   class="btn btn-info btn-block">Edit</a>
            </div>
        </div>
    </ng-container>
    <ng-container imageOverlayContent>
        <div style="width: 100%; display: flex; justify-content: end">
            <app-popularity-label style="margin-right: 10px" [realtyObject]="realtyObject"></app-popularity-label>
        </div>
    </ng-container>
</app-realty-obj-card-details>
